<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>pi web</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="apple-touch-icon" href="/icons/icon-192.png">
	<meta name="theme-color" content="#1f2937">
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
	<div id="app">
		<header id="titlebar"></header>
		<div id="frame">
				<aside id="sidebar" aria-label="세션 목록"></aside>
				<div id="sidebar-backdrop" hidden></div>
			<main id="panel">
				<div id="view-home" class="view hidden"></div>
				<div id="view-session" class="view hidden">
					<div id="session-head"></div>
					<div id="session-split">
						<div id="session-main">
							<div id="transcript-wrap">
								<div id="transcript"></div>
							</div>
							<div id="composer-area"></div>
						</div>
						<aside id="review" class="hidden"></aside>
					</div>
				</div>
			</main>
		</div>
	</div>
	<div id="toasts" aria-live="polite"></div>
	<div id="modal-root"></div>
	<script type="module" src="/js/app.js"></script>
</body>
</html>
